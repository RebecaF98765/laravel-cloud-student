name: Auto Merge tests into main

on:
  workflow_run:
    workflows: ["CI Laravel"]
    types:
      - completed

permissions:
  contents: write

jobs:
  merge:
    # Executa només si CI és OK i la branca és tests
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'tests'
    runs-on: ubuntu-latest

    steps:
      - name: Debug inputs
        run: |
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Head branch: ${{ github.event.workflow_run.head_branch }}"

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge branches preferring tests changes
        run: |
          git fetch origin
          git checkout main
          git merge -X theirs origin/tests -m "Auto-merge tests -> main (prefer tests changes)"
          git push origin main
